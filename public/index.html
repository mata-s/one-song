

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OneSong</title>
  <meta
    name="description"
    content="今日の一曲を置いていく音楽アプリ OneSong"
  />

  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --card: rgba(255, 255, 255, 0.06);
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.70);
      --line: rgba(255, 255, 255, 0.12);
      --accent: #f6d6c7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(246, 214, 199, 0.14), transparent 32%),
        linear-gradient(180deg, #8FAED1 0%, #1E2C45 100%);
      color: var(--text);
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 72px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 56px;
    }

    .brand {
      color: var(--accent);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 48px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 9vw, 92px);
      line-height: 0.95;
      letter-spacing: -0.08em;
    }

    .lead {
      margin-top: 24px;
      max-width: 560px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.9;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      transition: transform 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: var(--accent);
      color: #1E2C45;
    }

    .secondary {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .art {
      display: flex;
      justify-content: center;
    }

    .art-card {
      width: min(100%, 420px);
      aspect-ratio: 1;
      border-radius: 38px;
      background:
        radial-gradient(circle at bottom left, rgba(255, 162, 89, 0.95), transparent 28%),
        linear-gradient(180deg, #0D1C53 0%, #49296C 55%, #C6487A 100%);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .wave {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bar {
      width: 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, #FFE7D8 0%, #FFB7A0 100%);
      box-shadow: 0 0 18px rgba(255, 210, 190, 0.24);
    }

    .b1 { height: 20px; opacity: 0.6; }
    .b2 { height: 42px; opacity: 0.72; }
    .b3 { height: 78px; opacity: 0.84; }
    .b4 { height: 124px; }
    .b5 { height: 78px; opacity: 0.84; }
    .b6 { height: 42px; opacity: 0.72; }
    .b7 { height: 20px; opacity: 0.6; }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #FFD6C6;
      opacity: 0.72;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: rgba(248, 250, 252, 0.48);
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .art {
        order: -1;
      }

      nav {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <nav>
      <div class="brand">OneSong</div>

      <div class="nav-links">
        <a href="/privacy.html">プライバシーポリシー</a>
        <a href="/terms.html">利用規約</a>
        <a href="/contact.html">お問い合わせ</a>
      </div>
    </nav>

    <section class="hero">
      <div>
        <div class="eyebrow">今日の一曲を置いていく</div>

        <h1>
          One<br />Song
        </h1>

        <p class="lead">
          今日の気分を、一曲だけ。<br />
          OneSongは、その日に聴きたかった曲を静かに置いていく音楽アプリです。
        </p>

        <div class="actions">
          <a class="button primary" href="#">
            App Store 準備中
          </a>

          <a class="button secondary" href="/privacy.html">
            詳しく見る
          </a>
        </div>
      </div>

      <div class="art">
        <div class="art-card">
          <div class="wave">
            <div class="dot"></div>
            <div class="bar b1"></div>
            <div class="bar b2"></div>
            <div class="bar b3"></div>
            <div class="bar b4"></div>
            <div class="bar b5"></div>
            <div class="bar b6"></div>
            <div class="bar b7"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="footer">
      © OneSong
    </div>
  </main>
</body>
</html>
