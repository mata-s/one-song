<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>お問い合わせ | OneSong</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --card: rgba(255, 255, 255, 0.06);
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.68);
      --line: rgba(255, 255, 255, 0.12);
      --accent: #f6d6c7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(246, 214, 199, 0.16), transparent 34%),
        linear-gradient(180deg, #1c2740 0%, #111827 100%);
      color: var(--text);
      line-height: 1.8;
    }

    main {
      width: min(820px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    .hero {
      margin-bottom: 28px;
    }

    .app-name {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.05);
    }

    h1 {
      margin: 20px 0 8px;
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    .nav a:hover {
      background: rgba(255, 255, 255, 0.10);
      text-decoration: none;
    }


    section {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.18);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
    }

    .mail {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 10px;
      padding: 16px 18px;
      border-radius: 20px;
      background: rgba(246, 214, 199, 0.13);
      border: 1px solid rgba(246, 214, 199, 0.18);
      color: var(--accent);
      text-decoration: none;
      font-weight: 800;
      word-break: break-all;
    }

    .mail:hover {
      background: rgba(246, 214, 199, 0.18);
    }

    .hint {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(248, 250, 252, 0.58);
      font-size: 13px;
      line-height: 1.7;
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: rgba(248, 250, 252, 0.52);
    }

    .footer {
      margin-top: 28px;
      color: rgba(248, 250, 252, 0.46);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <div class="app-name">OneSong</div>
      <h1>お問い合わせ</h1>
      <p class="lead">OneSongに関するご質問、不具合報告、ご要望はこちらからご連絡ください。</p>

      <div class="nav">
        <a href="/">ホーム</a>
        <a href="/privacy.html">プライバシーポリシー</a>
        <a href="/terms.html">利用規約</a>
      </div>
    </div>

    <section>
      <h2>メールでのお問い合わせ</h2>
      <p>不具合報告、ご要望、その他のお問い合わせは、以下のメールアドレス宛にご連絡ください。</p>
      <a class="mail" href="mailto:splingnew@gmail.com">splingnew@gmail.com</a>
      <div class="hint">
        お問い合わせの際は、可能であればご利用端末、OSバージョン、発生した画面や状況を添えていただけると確認がスムーズです。
      </div>

      <p class="note">
        投稿内容や権利に関する削除依頼についても、上記メールアドレスよりご連絡ください。<br />
        内容によっては返信にお時間をいただく場合があります。
      </p>
    </section>

    <p class="footer">© OneSong</p>
  </main>
</body>
</html>
